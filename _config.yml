title: 椰风寨
description: 旗未动，风也未动，是人的心自己在动
lang: zh-CN

remote_theme: "jekyll/minima@1e8a445"

minima:
  social_links:
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/yanbai-zhang-338a7444/"
    - title: Instagram
      icon: instagram
      url: "https://www.instagram.com/byne_zhang/"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: true

exclude:
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - vendor

# Every root-level Markdown page is an article; README stays the homepage.
defaults:
  - scope:
      path: "*.md"
    values:
      layout: article
  - scope:
      path: "README.md"
    values:
      layout: home
