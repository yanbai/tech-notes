<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E4D8"/>
      <stop offset="0.45" stop-color="#EADBC0"/>
      <stop offset="0.68" stop-color="#F4B98C"/>
      <stop offset="0.8" stop-color="#E3C9B6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CFD2"/>
      <stop offset="1" stop-color="#9FAEB6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD39A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD39A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="130" cy="560" r="130" fill="url(#sun)"/>
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="120" cy="230" rx="140" ry="22"/>
    <ellipse cx="660" cy="180" rx="160" ry="20"/>
    <ellipse cx="700" cy="330" rx="120" ry="16"/>
    <ellipse cx="90" cy="420" rx="110" ry="14"/>
  </g>
  <g fill="#9AA3AE" opacity="0.35">
    <ellipse cx="160" cy="275" rx="150" ry="18"/>
    <ellipse cx="680" cy="250" rx="140" ry="16"/>
  </g>
  <rect y="630" width="800" height="170" fill="url(#sea)"/>
  <g stroke="#E6EAEC" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="30" y1="665" x2="110" y2="665"/>
    <line x1="60" y1="710" x2="170" y2="710"/>
    <line x1="640" y1="680" x2="740" y2="680"/>
    <line x1="600" y1="740" x2="700" y2="740"/>
  </g>
  <rect x="768" y="620" width="26" height="10" rx="2" fill="#6F7F8A"/>
  <rect x="776" y="612" width="10" height="9" fill="#6F7F8A"/>

  <!-- shirt -->
  <path d="M80,800 C100,715 200,675 300,662 L500,662 C600,675 700,715 720,800 Z"
        fill="#C8D5CB" stroke="#3A2E28" stroke-width="5" stroke-linejoin="round"/>
  <!-- neck -->
  <path d="M335,550 L335,672 Q400,712 465,672 L465,550 Z" fill="#EDBE98" stroke="#3A2E28" stroke-width="5"/>
  <path d="M335,600 Q400,640 465,600" fill="none" stroke="#D9A27E" stroke-width="6" opacity="0.6"/>
  <!-- collar -->
  <path d="M305,664 Q400,735 495,664" fill="none" stroke="#3A2E28" stroke-width="20" stroke-linecap="round"/>
  <path d="M305,664 Q400,735 495,664" fill="none" stroke="#A9BAAE" stroke-width="12" stroke-linecap="round"/>

  <!-- ears -->
  <ellipse cx="248" cy="405" rx="32" ry="48" fill="#F1C6A0" stroke="#3A2E28" stroke-width="5"/>
  <ellipse cx="552" cy="405" rx="32" ry="48" fill="#F1C6A0" stroke="#3A2E28" stroke-width="5"/>
  <path d="M245,385 Q232,405 248,428" fill="none" stroke="#D49C78" stroke-width="5" stroke-linecap="round"/>
  <path d="M555,385 Q568,405 552,428" fill="none" stroke="#D49C78" stroke-width="5" stroke-linecap="round"/>

  <!-- face -->
  <path d="M255,300 C255,200 320,165 400,165 C480,165 545,200 545,300 L545,420
           C545,525 470,590 400,590 C330,590 255,525 255,420 Z"
        fill="#F4CBA6" stroke="#3A2E28" stroke-width="5"/>
  <!-- stubble -->
  <ellipse cx="400" cy="560" rx="70" ry="20" fill="#7A6455" opacity="0.08"/>

  <!-- buzz-cut hair -->
  <path d="M250,330 C232,195 310,128 400,128 C490,128 568,195 550,330
           C545,268 505,212 400,206 C295,212 255,268 250,330 Z"
        fill="#2E2723" stroke="#2E2723" stroke-width="5" stroke-linejoin="round"/>

  <!-- brows -->
  <path d="M298,330 Q338,310 377,327" fill="none" stroke="#2E2723" stroke-width="11" stroke-linecap="round"/>
  <path d="M423,327 Q462,310 502,330" fill="none" stroke="#2E2723" stroke-width="11" stroke-linecap="round"/>

  <!-- smiling eyes -->
  <path d="M305,378 Q338,350 372,378" fill="none" stroke="#2E2723" stroke-width="8" stroke-linecap="round"/>
  <path d="M428,378 Q462,350 495,378" fill="none" stroke="#2E2723" stroke-width="8" stroke-linecap="round"/>
  <path d="M318,392 Q338,400 358,392" fill="none" stroke="#C99474" stroke-width="4" stroke-linecap="round"/>
  <path d="M442,392 Q462,400 482,392" fill="none" stroke="#C99474" stroke-width="4" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M402,378 Q396,425 382,440 Q400,454 420,442" fill="none" stroke="#C08560" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blush -->
  <ellipse cx="305" cy="448" rx="30" ry="15" fill="#F39C86" opacity="0.45"/>
  <ellipse cx="495" cy="448" rx="30" ry="15" fill="#F39C86" opacity="0.45"/>
  <!-- mole -->
  <circle cx="458" cy="420" r="3.5" fill="#7A5A48"/>

  <!-- big smile -->
  <path d="M330,478 Q400,560 470,478 Q400,494 330,478 Z" fill="#9A3E3E" stroke="#3A2E28" stroke-width="5" stroke-linejoin="round"/>
  <path d="M340,483 Q400,497 460,483 L452,503 Q400,516 348,503 Z" fill="#FFFFFF"/>
  <path d="M330,478 Q400,494 470,478" fill="none" stroke="#3A2E28" stroke-width="5" stroke-linecap="round"/>
</svg>
