<header class="site-header">

  <div class="wrapper">
    {%- if page.layout == "article" %}
    <button class="drawer-toggle" type="button" aria-label="全部文章" aria-controls="article-sidebar" aria-expanded="false" data-drawer-open>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    {%- endif %}
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  </div>
</header>
